<svg viewBox="0 0 1240 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1240" height="900" fill="#ffffff"/>
  <text x="620" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Library Lending Tracker (Formative 2): Transactions, Pending Pool and Mining</text>

  <!-- 1. Librarian / CLI -->
  <rect x="30" y="70" width="230" height="150" rx="8" fill="#eef4ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="145" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3f8f">Librarian (CLI, main.c)</text>
  <text x="45" y="122" font-size="13" fill="#222">Login: PBKDF2 password,</text>
  <text x="45" y="140" font-size="13" fill="#222">ECDSA P-256 key unlocked</text>
  <text x="45" y="164" font-size="13" fill="#222">--model utxo | account</text>
  <text x="45" y="182" font-size="13" fill="#222">--difficulty 1-4</text>
  <text x="45" y="206" font-size="12" fill="#555">registry: books.txt, members.txt</text>

  <!-- 2. Lending events -->
  <rect x="300" y="70" width="290" height="190" rx="8" fill="#f2fbf2" stroke="#2f8f3a" stroke-width="2"/>
  <text x="445" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6a29">Lending events (lending.c, tokens.c)</text>
  <text x="315" y="122" font-size="13" fill="#222">BORROWED  - reward 0, no transaction</text>
  <text x="315" y="142" font-size="13" fill="#222">OVERDUE   - reward 0, no transaction</text>
  <text x="315" y="162" font-size="13" fill="#222">RETURNED on time - reward 10</text>
  <text x="315" y="182" font-size="13" fill="#222">RETURNED late    - reward 5</text>
  <text x="315" y="202" font-size="13" fill="#222">TRANSFER  - member to member</text>
  <text x="315" y="228" font-size="12" fill="#555">Reward tx: LIBRARY pays reward, 1 coin fee</text>
  <text x="315" y="246" font-size="12" fill="#555">to the miner, the rest to the member</text>

  <!-- 3. Sign -->
  <rect x="630" y="70" width="260" height="150" rx="8" fill="#fff7e8" stroke="#c98a12" stroke-width="2"/>
  <text x="760" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a00">Sign + admit</text>
  <text x="645" y="122" font-size="13" fill="#222">tx_id = SHA-256(tx body)</text>
  <text x="645" y="142" font-size="13" fill="#222">ledger_admit: UTXO locks inputs /</text>
  <text x="645" y="160" font-size="13" fill="#222">account checks nonce + balance</text>
  <text x="645" y="184" font-size="13" fill="#222">block content (incl. token_reward,</text>
  <text x="645" y="202" font-size="13" fill="#222">tx_id) signed with librarian key</text>

  <!-- 4. Pending pool -->
  <rect x="930" y="70" width="280" height="150" rx="8" fill="#fdeef0" stroke="#c23a4e" stroke-width="2"/>
  <text x="1070" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#8f1d2e">Pending pool (pending.dat)</text>
  <text x="945" y="122" font-size="13" fill="#222">FIFO of signed, UNCONFIRMED</text>
  <text x="945" y="140" font-size="13" fill="#222">blocks + their transactions</text>
  <text x="945" y="164" font-size="13" fill="#222">no index / previous_hash / nonce yet</text>
  <text x="945" y="188" font-size="13" fill="#222">balances not changed yet</text>
  <text x="945" y="206" font-size="12" fill="#555">re-admitted on restart</text>

  <line x1="260" y1="145" x2="296" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="145" x2="626" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="890" y1="145" x2="926" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Mining -->
  <rect x="640" y="290" width="570" height="230" rx="8" fill="#f3efff" stroke="#6a4bc4" stroke-width="2"/>
  <text x="925" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#43288f">Mining = confirmation step (mining.c)</text>
  <text x="655" y="342" font-size="13" fill="#222">1. validate: librarian signature, tx matches block</text>
  <text x="655" y="362" font-size="13" fill="#222">2. set index, previous_hash = tip hash, difficulty, mined_by</text>
  <text x="655" y="382" font-size="13" fill="#222">3. nonce++ until SHA-256(header || nonce) starts with d zeros</text>
  <text x="655" y="402" font-size="13" fill="#222">4. append to chain, confirm tx in ledger, pay coinbase</text>
  <rect x="655" y="420" width="170" height="88" rx="6" fill="#ffffff" stroke="#6a4bc4"/>
  <text x="740" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#43288f">Solo</text>
  <text x="665" y="460" font-size="12" fill="#222">one miner, full reward</text>
  <text x="665" y="477" font-size="12" fill="#222">50/block + fees</text>
  <text x="665" y="494" font-size="12" fill="#222">shows hash attempts</text>
  <rect x="840" y="420" width="170" height="88" rx="6" fill="#ffffff" stroke="#6a4bc4"/>
  <text x="925" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#43288f">Pool</text>
  <text x="850" y="460" font-size="12" fill="#222">random hash rates</text>
  <text x="850" y="477" font-size="12" fill="#222">2% pool fee, share =</text>
  <text x="850" y="494" font-size="12" fill="#222">attempts / total</text>
  <rect x="1025" y="420" width="170" height="88" rx="6" fill="#ffffff" stroke="#6a4bc4"/>
  <text x="1110" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#43288f">Cloud</text>
  <text x="1035" y="460" font-size="12" fill="#222">1-5 rounds, 400 h/round</text>
  <text x="1035" y="477" font-size="12" fill="#222">rental 20 + 10% maint.</text>
  <text x="1035" y="494" font-size="12" fill="#222">unprofitable warning</text>

  <line x1="1070" y1="220" x2="1070" y2="286" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. Chain -->
  <rect x="30" y="290" width="570" height="230" rx="8" fill="#eef7f9" stroke="#1f7f95" stroke-width="2"/>
  <text x="315" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#11586a">Confirmed chain (chain.dat, blockchain.c)</text>
  <g font-size="12" fill="#222">
    <rect x="45" y="330" width="160" height="170" rx="5" fill="#ffffff" stroke="#1f7f95"/>
    <text x="55" y="348" font-weight="bold">Block 0 (genesis)</text>
    <text x="55" y="368">prev = 64 zeros</text>
    <text x="55" y="386">tx_id = treasury fund</text>
    <text x="55" y="404">(10,000 coins)</text>
    <text x="55" y="428">nonce, difficulty</text>
    <text x="55" y="446">hash = 00..</text>
    <rect x="235" y="330" width="160" height="170" rx="5" fill="#ffffff" stroke="#1f7f95"/>
    <text x="245" y="348" font-weight="bold">Block n</text>
    <text x="245" y="368">book, member, action</text>
    <text x="245" y="386">token_reward = 10</text>
    <text x="245" y="404">tx_id = SHA-256(tx)</text>
    <text x="245" y="422">signature (ECDSA)</text>
    <text x="245" y="440">prev = hash of n-1</text>
    <text x="245" y="458">nonce, difficulty</text>
    <text x="245" y="476">hash = 00..</text>
    <rect x="425" y="330" width="160" height="170" rx="5" fill="#ffffff" stroke="#1f7f95"/>
    <text x="435" y="348" font-weight="bold">Block n+1</text>
    <text x="435" y="368">prev = hash of n</text>
    <text x="435" y="392">Validation checks:</text>
    <text x="435" y="410">hash recomputed</text>
    <text x="435" y="428">link to previous</text>
    <text x="435" y="446">signature (public key)</text>
    <text x="435" y="464">PoW leading zeros</text>
    <text x="435" y="482">tx_id exists in ledger</text>
  </g>
  <line x1="205" y1="415" x2="231" y2="415" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="395" y1="415" x2="421" y2="415" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="640" y1="405" x2="604" y2="405" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="608" y="396" font-size="11" fill="#333">append</text>

  <!-- 7. Ledger -->
  <rect x="30" y="560" width="1180" height="300" rx="8" fill="#fbfbf2" stroke="#8a8a1f" stroke-width="2"/>
  <text x="620" y="586" text-anchor="middle" font-size="15" font-weight="bold" fill="#5c5c0f">Token ledger (ledger.c): confirmed transaction log (ledger.dat), replayed at startup into the chosen model</text>

  <rect x="50" y="605" width="340" height="235" rx="6" fill="#ffffff" stroke="#8a8a1f"/>
  <text x="220" y="627" text-anchor="middle" font-size="14" font-weight="bold" fill="#5c5c0f">Transaction (transaction.c)</text>
  <g font-size="12" fill="#222">
    <text x="65" y="652">txid = SHA-256(type | sender | recipient |</text>
    <text x="65" y="670">          amount | fee | nonce | time | memo)</text>
    <text x="65" y="694">COINBASE: treasury fund, mining rewards</text>
    <text x="65" y="712">REWARD: LIBRARY -> member (return)</text>
    <text x="65" y="730">TRANSFER: member -> member</text>
    <text x="65" y="754">amounts in integer cents (1 coin = 100)</text>
    <text x="65" y="772">fixed fee 1 coin -> miner</text>
    <text x="65" y="796">tampered ledger.dat: txid mismatch,</text>
    <text x="65" y="814">refused at startup</text>
  </g>

  <rect x="420" y="605" width="370" height="235" rx="6" fill="#ffffff" stroke="#8a8a1f"/>
  <text x="605" y="627" text-anchor="middle" font-size="14" font-weight="bold" fill="#5c5c0f">UTXO model (utxo.c)</text>
  <g font-size="12" fill="#222">
    <text x="435" y="652">UTXO set: (txid, vout, owner, amount)</text>
    <text x="435" y="670">balance = sum of owner's unspent outputs</text>
    <text x="435" y="694">inputs: oldest outputs of the sender</text>
    <text x="435" y="712">outputs: [0] recipient, [1] change</text>
    <text x="435" y="730">fee = inputs - outputs</text>
    <text x="435" y="754">pending tx locks its inputs (reserved_by)</text>
    <text x="435" y="772">spent / locked input = double spend</text>
    <text x="435" y="790">inputs &lt; amount + fee = rejected</text>
    <text x="435" y="814">full UTXO set shown after each block</text>
  </g>

  <rect x="820" y="605" width="370" height="235" rx="6" fill="#ffffff" stroke="#8a8a1f"/>
  <text x="1005" y="627" text-anchor="middle" font-size="14" font-weight="bold" fill="#5c5c0f">Account model (account.c)</text>
  <g font-size="12" fill="#222">
    <text x="835" y="652">account: id, balance, nonce,</text>
    <text x="835" y="670">reserved, pending_count</text>
    <text x="835" y="694">debit sender amount + fee,</text>
    <text x="835" y="712">credit recipient amount, nonce++</text>
    <text x="835" y="736">nonce must equal next expected:</text>
    <text x="835" y="754">reused or skipped nonce = rejected</text>
    <text x="835" y="772">balance &lt; amount + fee = rejected</text>
    <text x="835" y="796">history: linked list per account</text>
    <text x="835" y="814">(sender, recipient, amount, fee, nonce)</text>
  </g>

  <line x1="925" y1="520" x2="925" y2="556" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="933" y="545" font-size="11" fill="#333">confirm tx + coinbase payout</text>
  <line x1="315" y1="520" x2="315" y2="556" stroke="#333" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="323" y="545" font-size="11" fill="#333">block.tx_id references a ledger tx</text>
</svg>
