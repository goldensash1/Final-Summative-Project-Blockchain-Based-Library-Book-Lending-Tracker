<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1000" height="600" fill="#fff"/><text x="500.0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Figure 2. Pending pool flow: signing, checks, fraud flagging and prioritisation</text><rect x="20" y="70" width="150" height="100" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="95.0" y="101.16666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">CLI command</text><text x="95.0" y="116.16666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">borrow_book / return_book /</text><text x="95.0" y="131.16666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">reserve_book / renew_book /</text><text x="95.0" y="146.16666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">settle_fine / token_transfer</text><rect x="184" y="70" width="150" height="100" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="259.0" y="108.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Build record</text><text x="259.0" y="123.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">copy book title and member</text><text x="259.0" y="138.66666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">name from the registries</text><polyline points="170,120 184,120" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="348" y="70" width="150" height="100" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="423.0" y="101.16666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Sign (ECDSA P-256)</text><text x="423.0" y="116.16666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">member's private key</text><text x="423.0" y="131.16666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">(librarian key for</text><text x="423.0" y="146.16666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">OVERDUE / LOST)</text><polyline points="334,120 348,120" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="512" y="70" width="150" height="100" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="587.0" y="108.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Verify</text><text x="587.0" y="123.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">signature against the</text><text x="587.0" y="138.66666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">registered public key</text><polyline points="498,120 512,120" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="676" y="70" width="150" height="100" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="751.0" y="108.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Nonce check</text><text x="751.0" y="123.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">nonce must equal the</text><text x="751.0" y="138.66666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">signer's next nonce</text><polyline points="662,120 676,120" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="840" y="70" width="150" height="100" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="915.0" y="108.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">State check</text><text x="915.0" y="123.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">valid transition on the</text><text x="915.0" y="138.66666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">projected inventory</text><polyline points="826,120 840,120" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="20" y="215" width="300" height="60" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="170.0" y="233.66666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">REJECTED (not added)</text><text x="170.0" y="248.66666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">bad signature, wrong nonce, invalid</text><text x="170.0" y="263.66666666666663" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">transition, insufficient tokens</text><polyline points="587,170 587,245" fill="none" stroke="#000" stroke-width="1.4"/><polyline points="751,170 751,245" fill="none" stroke="#000" stroke-width="1.4"/><polyline points="860,170 860,245 587,245" fill="none" stroke="#000" stroke-width="1.4"/><polyline points="587,245 322,245" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="455" y="238" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">any check fails</text><polygon points="880,285.0 990.0,330 880,375.0 770.0,330" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="880" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">Fraud heuristics</text><text x="880" y="342" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">triggered?</text><polyline points="950,170 950,220 880,220 880,285" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="890" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start" fill="#000">all checks pass</text><rect x="830" y="420" width="100" height="50" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="880.0" y="441.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">SUSPICIOUS</text><text x="880.0" y="456.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">withheld</text><rect x="560" y="420" width="120" height="50" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="620.0" y="449.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">PENDING</text><polyline points="880,375 880,420" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="900" y="402" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">yes</text><polyline points="770,330 620,330 620,420" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="600" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">no</text><rect x="330" y="340" width="210" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="435.0" y="361.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Pending pool (pending.dat)</text><text x="435.0" y="376.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">request_id, book_id, copy_id,</text><text x="435.0" y="391.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">member_id, action_requested,</text><text x="435.0" y="406.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">priority, status</text><polyline points="560,445 500,445 500,422" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><polyline points="880,470 880,560 435,560 435,422" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="660" y="552" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">stays in the pool for fraud_review</text><rect x="20" y="330" width="260" height="130" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="28" y="353.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">Priority order (qsort)</text><text x="28" y="368.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">1. overdue-related first:</text><text x="28" y="383.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">   OVERDUE flags, late returns,</text><text x="28" y="398.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">   fine settlements</text><text x="28" y="413.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">2. waiting_since ascending</text><text x="28" y="428.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">   (reservation date)</text><text x="28" y="443.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">3. submission order</text><polyline points="330,380 282,380" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="20" y="490" width="260" height="60" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150.0" y="516.1666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Miner takes the top N PENDING</text><text x="150.0" y="531.1666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">(N = batch size, default 3)</text><polyline points="150,460 150,490" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/></svg>