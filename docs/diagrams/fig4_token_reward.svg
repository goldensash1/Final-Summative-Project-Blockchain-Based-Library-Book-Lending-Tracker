<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1000" height="480" fill="#fff"/><text x="500.0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Figure 4. Token reward flow: from return to mining confirmation to balance update</text><rect x="15" y="70" width="180" height="100" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="105.0" y="108.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">return_book &lt;copy&gt;</text><text x="105.0" y="123.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">on time or late?</text><text x="105.0" y="138.66666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">fine = days late x 1</text><rect x="212" y="70" width="180" height="100" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="302.0" y="108.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">RETURNED request</text><text x="302.0" y="123.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">token_reward 10 / 5</text><text x="302.0" y="138.66666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">signed by the member</text><polyline points="195,120 212,120" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="409" y="70" width="180" height="100" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="499.0" y="116.16666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Pending pool</text><text x="499.0" y="131.16666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">(no balance change yet)</text><polyline points="392,120 409,120" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="606" y="70" width="180" height="100" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="696.0" y="108.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Miner selects it</text><text x="696.0" y="123.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">creates reward tx:</text><text x="696.0" y="138.66666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">LIBRARY -&gt; member</text><polyline points="589,120 606,120" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="803" y="70" width="180" height="100" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="893.0" y="101.16666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Reward tx</text><text x="893.0" y="116.16666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">amount = reward - 1</text><text x="893.0" y="131.16666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">fee = 1 (to miner)</text><text x="893.0" y="146.16666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">txid = SHA-256(tx)</text><polyline points="786,120 803,120" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="800" y="230" width="185" height="90" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="892.5" y="256.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Block header</text><text x="892.5" y="271.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">token_reward = sum</text><text x="892.5" y="286.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">transaction_id =</text><text x="892.5" y="301.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">reward txid(s)</text><polyline points="895,170 895,230" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="560" y="230" width="190" height="90" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="655.0" y="263.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Proof of work</text><text x="655.0" y="278.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">nonce++ until the hash</text><text x="655.0" y="293.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">meets the difficulty</text><polyline points="800,275 752,275" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="320" y="230" width="190" height="90" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="415.0" y="263.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Block appended</text><text x="415.0" y="278.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">ledger_confirm(reward tx)</text><text x="415.0" y="293.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">request removed from pool</text><polyline points="560,275 512,275" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="30" y="210" width="240" height="70" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150.0" y="233.66666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">UTXO model</text><text x="150.0" y="248.66666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">new output (member, amount);</text><text x="150.0" y="263.66666666666663" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">LIBRARY change output</text><rect x="30" y="300" width="240" height="70" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150.0" y="323.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Account model</text><text x="150.0" y="338.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">LIBRARY debited, member credited,</text><text x="150.0" y="353.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">nonce + linked-list history</text><polyline points="320,260 272,245" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><polyline points="320,290 272,335" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="320" y="380" width="400" height="60" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="520.0" y="406.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Miner paid by a coinbase tx: 50 coins per block + all fees</text><text x="520.0" y="421.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">(solo: all; pool: shared by attempts after 2%; cloud: renter)</text><polyline points="415,320 415,380" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="500" y="465" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">A book that stays overdue and is not returned creates no reward transaction (OVERDUE record, token_reward 0).</text></svg>