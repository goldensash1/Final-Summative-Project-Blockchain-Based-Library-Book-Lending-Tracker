<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1000" height="640" fill="#fff"/><text x="500.0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Figure 1. Blockchain structure with the Merkle tree of each block</text><rect x="30" y="60" width="270" height="160" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="165.0" y="101.83333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Block #0 (genesis)</text><text x="165.0" y="118.83333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">record_count = 0</text><text x="165.0" y="135.83333333333331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">merkle_root = 64 zeros</text><text x="165.0" y="152.83333333333331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">transaction_id = treasury</text><text x="165.0" y="169.83333333333331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">coinbase (10,000 coins)</text><text x="165.0" y="186.83333333333331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">previous_hash = 64 zeros</text><rect x="365" y="60" width="270" height="160" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="500.0" y="101.83333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Block #1 header</text><text x="500.0" y="118.83333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">index, timestamp, record_count</text><text x="500.0" y="135.83333333333331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">previous_hash, merkle_root</text><text x="500.0" y="152.83333333333331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">sealed_by, token_reward</text><text x="500.0" y="169.83333333333331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">transaction_id, difficulty, nonce</text><text x="500.0" y="186.83333333333331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">hash = SHA-256(header + nonce)</text><rect x="700" y="60" width="270" height="160" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="835.0" y="101.83333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Block #2 header</text><text x="835.0" y="118.83333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">index, timestamp, record_count</text><text x="835.0" y="135.83333333333331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">previous_hash, merkle_root</text><text x="835.0" y="152.83333333333331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">sealed_by, token_reward</text><text x="835.0" y="169.83333333333331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">transaction_id, difficulty, nonce</text><text x="835.0" y="186.83333333333331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">hash = SHA-256(header + nonce)</text><polyline points="365,140 302,140" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="333" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">previous_hash</text><polyline points="700,140 637,140" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="668" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">previous_hash</text><text x="180" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Block #1 body:</text><text x="180" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">up to 3 signed lending</text><text x="180" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">records (batch size 1-8)</text><rect x="395" y="270" width="210" height="44" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="500.0" y="288.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Merkle root</text><text x="500.0" y="304.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">SHA-256(H12 || H33)</text><polyline points="500,270 500,222" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="510" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start" fill="#000">stored as merkle_root</text><rect x="280" y="350" width="190" height="44" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="375.0" y="368.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">H12</text><text x="375.0" y="384.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">SHA-256(H1 || H2)</text><rect x="530" y="350" width="190" height="44" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="625.0" y="368.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">H33</text><text x="625.0" y="384.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">SHA-256(H3 || H3)</text><polyline points="375,350 470,316" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><polyline points="625,350 530,316" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="200" y="430" width="170" height="44" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="285.0" y="448.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">H1</text><text x="285.0" y="464.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">SHA-256(record 1)</text><rect x="410" y="430" width="170" height="44" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="495.0" y="448.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">H2</text><text x="495.0" y="464.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">SHA-256(record 2)</text><rect x="620" y="430" width="170" height="44" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="705.0" y="448.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">H3</text><text x="705.0" y="464.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">SHA-256(record 3)</text><polyline points="285,430 340,396" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><polyline points="495,430 420,396" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><polyline points="705,430 625,396" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="185" y="505" width="200" height="100" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="285.0" y="528.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Record 1 (BORROWED)</text><text x="285.0" y="543.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">record_id, book_id, copy_id,</text><text x="285.0" y="558.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">member_id, action, due_date,</text><text x="285.0" y="573.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">fine, nonce, signer_pubkey,</text><text x="285.0" y="588.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">ECDSA signature</text><polyline points="285,505 285,476" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="395" y="505" width="200" height="100" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="495.0" y="528.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Record 2 (RETURNED)</text><text x="495.0" y="543.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">token_reward 10 or 5,</text><text x="495.0" y="558.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">fine_amount, condition</text><text x="495.0" y="573.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000"></text><text x="495.0" y="588.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">ECDSA signature</text><polyline points="495,505 495,476" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="605" y="505" width="200" height="100" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="705.0" y="528.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Record 3 (RESERVED)</text><text x="705.0" y="543.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">copy_id '-',</text><text x="705.0" y="558.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">book_id, member_id</text><text x="705.0" y="573.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000"></text><text x="705.0" y="588.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">ECDSA signature</text><polyline points="705,505 705,476" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="500" y="628" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">Odd number of nodes: the last node is paired with itself. Changing any record changes its leaf, the root, and makes validate_chain fail.</text></svg>