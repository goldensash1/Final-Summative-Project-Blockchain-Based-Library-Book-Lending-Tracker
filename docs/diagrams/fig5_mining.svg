<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1000" height="620" fill="#fff"/><text x="500.0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Figure 5. Mining workflow: difficulty and the solo, pool and cloud paths</text><rect x="330" y="60" width="340" height="60" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="500.0" y="86.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Pending pool (PENDING requests only)</text><text x="500.0" y="102.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">SUSPICIOUS ones are withheld</text><rect x="330" y="150" width="340" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="500.0" y="171.16666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Build block (batch_prepare)</text><text x="500.0" y="186.16666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">top N by priority; re-verify signature,</text><text x="500.0" y="201.16666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">nonce and transition; create reward txs;</text><text x="500.0" y="216.16666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">Merkle root, token_reward, transaction_id</text><polyline points="500,120 500,150" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="740" y="150" width="240" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="860.0" y="171.16666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Difficulty 1-4</text><text x="860.0" y="186.16666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">--difficulty N / set_difficulty</text><text x="860.0" y="201.16666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">target: N leading zeros</text><text x="860.0" y="216.16666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">expected attempts 16^N</text><polyline points="740,190 672,190" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="30" y="290" width="280" height="170" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="170.0" y="333.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">mine_solo</text><text x="170.0" y="348.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">one miner tries nonce</text><text x="170.0" y="363.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">0, 1, 2, ... until the</text><text x="170.0" y="378.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">hash meets the target</text><text x="170.0" y="393.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">prints attempts + time</text><text x="170.0" y="408.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">reward: 100% (50/block</text><text x="170.0" y="423.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">+ fees)</text><polyline points="500,230 500,260 170,260 170,290" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="360" y="290" width="280" height="170" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="500.0" y="326.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">mine_pool [n]</text><text x="500.0" y="341.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">n miners, random hash</text><text x="500.0" y="356.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">rates 100-500/round;</text><text x="500.0" y="371.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">miner k tries k, k+n, ...</text><text x="500.0" y="386.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">2% pool fee; share =</text><text x="500.0" y="401.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">attempts / total x reward</text><text x="500.0" y="416.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">table: ID, attempts,</text><text x="500.0" y="431.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">share %, reward</text><polyline points="500,230 500,260 500,260 500,290" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="690" y="290" width="280" height="170" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="830.0" y="326.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">mine_cloud &lt;1-5&gt;</text><text x="830.0" y="341.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">rented 400 attempts</text><text x="830.0" y="356.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">per round, fee 20/round;</text><text x="830.0" y="371.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">unsolved work carries</text><text x="830.0" y="386.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">to the next round;</text><text x="830.0" y="401.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">gross, fees, net profit;</text><text x="830.0" y="416.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">WARNING if fees &gt;</text><text x="830.0" y="431.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">rewards in any round</text><polyline points="500,230 500,260 830,260 830,290" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="280" y="510" width="440" height="70" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="500.0" y="533.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Commit: append block, confirm transactions, update the</text><text x="500.0" y="548.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">inventory / queues / nonces / fines,</text><text x="500.0" y="563.6666666666666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">remove confirmed requests, save all files</text><polyline points="170,460 170,490 500,490 500,510" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><polyline points="500,460 500,490 500,490 500,510" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><polyline points="830,460 830,490 500,490 500,510" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="500" y="605" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">Each block stores its own difficulty, so validate_chain checks it against the difficulty it was mined at.</text></svg>