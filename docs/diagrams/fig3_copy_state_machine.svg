<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1000" height="560" fill="#fff"/><text x="500.0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Figure 3. Copy inventory state machine and reservation queue</text><rect x="80" y="230" width="170" height="60" rx="25" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="165.0" y="264.3333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">AVAILABLE</text><rect x="430" y="230" width="170" height="60" rx="25" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="515.0" y="264.3333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">BORROWED</text><rect x="430" y="420" width="170" height="60" rx="25" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="515.0" y="446.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">RESERVED</text><text x="515.0" y="462.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">(held for queue head)</text><rect x="255" y="80" width="170" height="50" rx="25" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="340.0" y="109.33333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">LOST</text><polyline points="250,248 430,248" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="340" y="238" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">borrow_book (mined)</text><polyline points="430,274 250,274" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="340" y="293" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">return_book,</text><text x="340" y="308" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">queue empty</text><polyline points="515,290 515,420" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="580" y="340" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">return_book,</text><text x="580" y="355" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">queue not empty:</text><text x="580" y="370" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">offer to head</text><polyline points="470,420 470,290" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="415" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="end" fill="#000">borrow by the</text><text x="415" y="360" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="end" fill="#000">reserved member</text><polyline points="165,230 165,105 255,105" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="100" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">mark_lost</text><text x="100" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">+ reason code</text><polyline points="515,230 515,105 427,105" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="580" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">mark_lost + reason</text><text x="580" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">(holder fined 20)</text><text x="165" y="315" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">initial state (copies.txt / add_copy)</text><rect x="690" y="70" width="280" height="160" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="830.0" y="116.16666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Inside BORROWED (same state)</text><text x="830.0" y="131.16666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">renew_book: due + 7 days,</text><text x="830.0" y="146.16666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">max 2, no reservation queue,</text><text x="830.0" y="161.16666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">not overdue</text><text x="830.0" y="176.16666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">OVERDUE: due date passed,</text><text x="830.0" y="191.16666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">flagged once, fine 1 coin/day</text><polyline points="690,150 600,240" fill="none" stroke="#000" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/><rect x="690" y="300" width="280" height="200" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="830.0" y="343.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Reservation queue (FIFO per book_id)</text><text x="830.0" y="358.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000"></text><text x="830.0" y="373.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">reserve_book &lt;member&gt; &lt;book&gt;:</text><text x="830.0" y="388.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">allowed only when no copy</text><text x="830.0" y="403.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">is AVAILABLE; adds (member_id,</text><text x="830.0" y="418.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">reservation_date) at the tail</text><text x="830.0" y="433.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000"></text><text x="830.0" y="448.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">On return: head is removed and the</text><text x="830.0" y="463.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">copy becomes RESERVED for it</text><polyline points="690,450 602,450" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="645" y="440" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">dequeue head</text><text x="500" y="540" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">Only these transitions are accepted by state_apply(); anything else is rejected, both when a request is submitted and when the chain is replayed.</text></svg>