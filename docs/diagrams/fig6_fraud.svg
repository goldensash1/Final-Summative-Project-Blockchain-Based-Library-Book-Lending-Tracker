<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1000" height="560" fill="#fff"/><text x="500.0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Figure 6. Fraud detection pipeline: from submission to review</text><rect x="30" y="70" width="200" height="60" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="130.0" y="88.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Signed request</text><text x="130.0" y="103.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">passed signature, nonce</text><text x="130.0" y="118.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">and state checks</text><rect x="290" y="55" width="400" height="160" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="298" y="93.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">Heuristics (fraud.c)</text><text x="298" y="108.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">1. Excessive borrows: member already holds 3 copies</text><text x="298" y="123.66666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">2. Rapid re-borrow: same title within 24 h of return</text><text x="298" y="138.66666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">3. Duplicate: request_id already on chain / in pool</text><text x="298" y="153.66666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">    (replay_request)</text><text x="298" y="168.66666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">4. Condition manipulation: return lowers condition</text><text x="298" y="183.66666666666669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">    by &gt; 1 level with no reason code</text><polyline points="230,100 290,100" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="760" y="70" width="210" height="50" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="865.0" y="91.16666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">PENDING</text><text x="865.0" y="106.16666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">mined normally</text><polyline points="690,95 760,95" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="725" y="86" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">none</text><rect x="400" y="270" width="180" height="60" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="490.0" y="296.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">SUSPICIOUS</text><text x="490.0" y="311.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">reason saved; never mined</text><polyline points="490,215 490,270" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="500" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start" fill="#000">any triggered</text><rect x="400" y="370" width="180" height="60" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="490.0" y="396.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">fraud_review</text><text x="490.0" y="411.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">lists flagged requests</text><polyline points="490,330 490,370" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="120" y="470" width="300" height="70" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="270.0" y="493.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">approve_suspicious &lt;id&gt;</text><text x="270.0" y="508.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">status -&gt; PENDING (approved);</text><text x="270.0" y="523.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">mined in priority order</text><rect x="560" y="470" width="320" height="70" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="720.0" y="493.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">reject_suspicious &lt;id&gt;</text><text x="720.0" y="508.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">request discarded; later requests of the same</text><text x="720.0" y="523.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">signer re-signed with corrected nonces</text><polyline points="450,430 270,470" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="330" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">approve</text><polyline points="530,430 720,470" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/><text x="650" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">reject</text><polyline points="120,505 40,505 40,235 865,235 865,122" fill="none" stroke="#000" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="700" y="228" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">approved: back to PENDING</text><text x="800" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">A duplicate (replay) can only</text><text x="800" y="406" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">be rejected, never approved.</text></svg>